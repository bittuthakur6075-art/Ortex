<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta Tags. scripts/prerender.mjs rewrites the title, description,
         canonical, robots and social tags per route by matching these exact
         tag shapes, so keep one tag per line in this form. -->
    <title>Custom Lanyards, Badges & Corporate Gifts, Delhi | Ortex</title>
    <meta
      name="description"
      content="Delhi manufacturer of customised lanyards, ID card holders, badges, momentos, MDF and acrylic products and corporate gifts. OEM, PAN India delivery, export."
    />
    <meta name="author" content="Ortex Industries" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://bizgift.ortexindustries.in/" />

    <!-- Fonts: self-hosted (src/index.css @font-face). Preloading Manrope lets
         the prerendered text paint in it without a font swap. -->
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Icons & Theme. Google Search shows a square icon of at least 48px, so the
         192px PNG is listed next to the SVG; iOS needs its own 180px PNG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ortex Industries" />
    <meta property="og:title" content="Custom Lanyards, Badges & Corporate Gifts, Delhi | Ortex" />
    <meta
      property="og:description"
      content="Delhi manufacturer of customised lanyards, ID card holders, badges, momentos, MDF and acrylic products and corporate gifts. OEM, PAN India delivery, export."
    />
    <meta property="og:url" content="https://bizgift.ortexindustries.in/" />
    <meta property="og:image" content="https://bizgift.ortexindustries.in/img/og-ortex.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ortex Industries: custom products manufactured for your brand" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Custom Lanyards, Badges & Corporate Gifts, Delhi | Ortex" />
    <meta
      name="twitter:description"
      content="Delhi manufacturer of customised lanyards, ID card holders, badges, momentos, MDF and acrylic products and corporate gifts. OEM, PAN India delivery, export."
    />
    <meta name="twitter:image" content="https://bizgift.ortexindustries.in/img/og-ortex.jpg" />

         "Ortex Industries" instead of the bare domain) and one business entity.
         Page JSON-LD refers back to these @ids. The address must match
         ADDRESS in src/constants/site.js and the Google Business Profile. -->

        "@graph": [

            "name": "Ortex Industries",
            "alternateName": ["Ortex", "Ortex Industries Private Limited"],
            "inLanguage": "en-IN",
            "publisher": { "@id": "https://bizgift.ortexindustries.in/#organization" }
          },
          {
            "@type": ["Organization", "LocalBusiness"],
            "@id": "https://bizgift.ortexindustries.in/#organization",
            "name": "Ortex Industries",
            "legalName": "Ortex Industries Private Limited",
            "url": "https://bizgift.ortexindustries.in/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://bizgift.ortexindustries.in/img/logo.png"
            },
            "image": "https://bizgift.ortexindustries.in/img/og-ortex.jpg",
            "description": "Delhi manufacturer of customized products: MDF and acrylic items, lanyards, ID badges, examination boards and corporate gifts. OEM and white-label production with PAN India delivery and worldwide export.",
            "email": "sales@ortexindustries.in",
            "telephone": "+91-9211947188",
