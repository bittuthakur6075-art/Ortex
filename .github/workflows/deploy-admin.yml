name: Deploy Admin

# Production deploy of the business console (Vercel project ortex-admin) on
# every push to Development that touches Ortex.Admin. It uses the Vercel CLI,
# the same `vercel deploy --prod` that deploys by hand, so the Vercel GitHub
# app is not needed. Vercel builds it with the project's own Production
# environment variables (npm run build, check-env included).
#
# Needs one repository secret: VERCEL_TOKEN (vercel.com/account/tokens, scoped
# to the ortex-industries team). Without it the deploy step is skipped.

on:
  push:
    branches: [Development]
    paths:
      - "Ortex.Admin/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    name: Ortex.Admin → Vercel production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ortex.Admin
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_UeksgkuUSpg5hzFbzTCj49x4
      VERCEL_PROJECT_ID: prj_On2BOePGUvTLmXJbo003IqzqoiSD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Ortex.Admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # This step used to print a notice and let the job pass. A green tick on
      # a run that deployed nothing is worse than no run at all: on 2026-09-30
      # the console was reported as live for half an hour while the site still
      # served a three-day-old build. A missing token is now a failed job.
      - name: Require a Vercel token
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "::error title=No VERCEL_TOKEN::Nothing was deployed. Add VERCEL_TOKEN under Settings, Secrets and variables, Actions (a token from vercel.com/account/tokens, scoped to the ortex-industries team), then re-run this job."
          exit 1
      - name: Deploy to production
        run: npx --yes vercel@60 deploy --prod --yes --token "$VERCEL_TOKEN"
