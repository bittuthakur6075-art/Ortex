name: CI

on:
  push:
    branches: [Development, main]
  pull_request:
    branches: [Development, main]

jobs:
  web:
    name: Ortex.Web — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ortex.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Ortex.Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # CI holds no production credentials, so it builds in a non-production
      # mode: the same code and prerender (on the static catalogue). The
      # production build and its credential guard run where the keys live.
      - run: npm run build:ci

  admin:
    name: Ortex.Admin — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ortex.Admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Ortex.Admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Same reason: build:staging needs no credentials and runs on demo data.
      - run: npm run build:staging
      - run: npm run check:functions   # Deno 2 fetched via npx

  mobile:
    name: Ortex.Mobile — lint + typecheck + tests + bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ortex.Mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Ortex.Mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Asserts the mobile GST engine still agrees with Ortex.Admin's, so a change
      # to one without the other fails here rather than on a real quotation.
      - run: npm test
      # No Android SDK on this runner, so the native build is out of reach — but
      # a Metro bundle still catches every broken import, alias and missing peer.
      - run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output /tmp/android.bundle

  connector:
    name: Ortex.Tally.Connector — XML fixture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ortex.Tally.Connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Ortex.Tally.Connector/package-lock.json
      - run: npm ci
      - run: npm run fixture
