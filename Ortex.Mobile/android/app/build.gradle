apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    //
    // STATED, not left to the default. `BundleHermesCTask` builds its `sources`
    // input as a file tree over `root`, excluding `**/android/**` and
    // `**/build/**` — so with the JS project as the root there is no overlap with
    // anything Gradle generates. Left unset, the tree was rooted at
    // `android/app`, where those two exclusions match nothing, and every task
    // writing into `android/app/build` became an undeclared input of the bundle
    // task. Gradle 9 fails the build on that rather than warning:
    //
    //   Task ':app:createBundleReleaseJsAndAssets' uses this output of task
    //   ':app:checkReleaseAarMetadata' without declaring ... a dependency
    root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
    //
    // Added by install-expo-modules
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", rootDir.getAbsoluteFile().getParentFile().getAbsolutePath(), "android", "absolute"].execute(null, rootDir).text.trim())
    // RESOLVED FROM `expo`, not from the android directory.
    //
    // `install-expo-modules` wrote `require.resolve('@expo/cli')`, which assumes
    // npm hoisted that package to the top level. Here it did not — it sits at
    // `node_modules/expo/node_modules/@expo/cli` — so the resolve threw, the
    // `.execute()` above returned an EMPTY string, and `new File("")` quietly
    // became the project directory, `android/app`.
    //
    // That is the whole reason a release build failed: `BundleHermesCTask` then
    // declared `android/app` as an @InputFile, so every task writing into
    // `android/app/build` (BuildConfig, AAR metadata check, each CMake step)
    // counted as an undeclared input, which Gradle 9 fails the build over
    // instead of warning about. It would have failed at execution too — there
    // was no CLI to run `export:embed` with.
    //
    // Resolving through `expo`'s own package.json finds the CLI whether npm
    // hoists it or nests it.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.ortexmobile"
    defaultConfig {
        applicationId "com.ortexmobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // THE FIELD BUILD's identity. The keystore sits beside this file and is
        // gitignored (`*.keystore`); its passwords live in the machine's own
        // ~/.gradle/gradle.properties, never in the repo.
        //
        // Guarded, because a checkout without those properties must still be
        // able to build: with no credentials the release type falls back to the
        // debug key below, which is exactly what the template did.
        //
        // ⚠️ BACK THE KEYSTORE UP. Android identifies an app by its signature, so
        // a lost key means the sales team must uninstall before they can install
        // the next build — an update signed with a different key is refused.
        if (project.hasProperty('ORTEX_STORE_FILE')) {
            release {
                storeFile file(ORTEX_STORE_FILE)
                storePassword ORTEX_STORE_PASSWORD
                keyAlias ORTEX_KEY_ALIAS
                keyPassword ORTEX_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig project.hasProperty('ORTEX_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            // R8 also drops unreferenced resources once it is shrinking code —
            // the two are a pair, and enabling only the first leaves every
            // drawable and string of the libraries in the APK.
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

/**
 * Ordering for the JS bundle task, so Gradle 9's validation lets a RELEASE build
 * through.
 *
 * Expo's `export:embed` bundle command (see the `react {}` block above) runs with
 * `android/app` as an input directory. Three other tasks WRITE inside that
 * directory — autolinking's generated New Architecture files, the release
 * BuildConfig, and CMake's per-ABI configure step — so Gradle 9, which now fails
 * a build on an undeclared input/output overlap rather than warning, refuses:
 *
 *   Task ':app:createBundleReleaseJsAndAssets' uses this output of task
 *   ':app:generateReleaseBuildConfig' without declaring ... a dependency
 *
 * Nothing is actually raced: the bundler only reads JS and assets, and never
 * looks at generated Java or .so files. But Gradle cannot know that from a
 * directory-level declaration, so the ordering is stated here — `mustRunAfter`,
 * which is exactly what the validation message asks for and, unlike `dependsOn`,
 * adds no work when those tasks are not in the graph.
 *
 * Matched by NAME rather than type: the CMake configure tasks are created per
 * ABI ("configureCMakeRelWithDebInfo[arm64-v8a]") by the Android plugin, so the
 * set is only known once the variants are configured.
 */
tasks.matching { it.name ==~ /create(Debug|Release)BundleJsAndAssets|createBundle(Debug|Release)JsAndAssets/ }.configureEach { bundleTask ->
    bundleTask.mustRunAfter(
        tasks.matching { other ->
            other.name.startsWith("generateAutolinking") ||
                other.name ==~ /generate(Debug|Release)BuildConfig/ ||
                other.name.startsWith("configureCMake")
        },
    )
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
