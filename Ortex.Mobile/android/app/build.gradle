apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * Run a `node` one-liner and hand back the path it printed, as a File. Throws
 * on an empty result instead of letting `new File("")` silently become the
 * project directory (see the `entryFile` / `cliFile` notes in `react {}`).
 */
def resolveNode(String what, List<String> command) {
    def out = command.execute(null, rootDir).text.trim()
    if (!out) {
        throw new GradleException("Could not resolve ${what}: `${command.join(' ')}` printed nothing. Is node_modules installed?")
    }
    return new File(out)
}

/**
 * Release signing needs all four properties from ~/.gradle/gradle.properties.
 * Checked as a set: `android {}` is evaluated at configuration time for EVERY
 * variant, so a half-filled file that names the keystore but not its password
 * would fail `assembleDebug` too, with a bare MissingPropertyException.
 */
def hasReleaseSigning = ["ORTEX_STORE_FILE", "ORTEX_STORE_PASSWORD", "ORTEX_KEY_ALIAS", "ORTEX_KEY_PASSWORD"]
    .every { project.hasProperty(it) }

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
    //
    // Added by install-expo-modules. Both `node` resolves below go through
    // `resolveNode`, which refuses an EMPTY result: `new File("")` is the
    // project directory, `android/app`, and handing that to the bundle task as
    // an input made every task writing into `android/app/build` an undeclared
    // dependency, which Gradle 9 fails on with a message that never names the
    // real cause. Failing here names it.
    entryFile = resolveNode("entryFile", ["node", "-e", "require('expo/scripts/resolveAppEntry')", rootDir.getAbsoluteFile().getParentFile().getAbsolutePath(), "android", "absolute"])
    // RESOLVED FROM `expo`, not from the android directory.
    //
    // `install-expo-modules` wrote `require.resolve('@expo/cli')`, which assumes
    // npm hoisted that package to the top level. Here it did not — it sits at
    // `node_modules/expo/node_modules/@expo/cli` — so the resolve threw, the
    // `.execute()` above returned an EMPTY string, and `new File("")` quietly
    // became the project directory, `android/app`.
    //
    // That is the whole reason a release build failed: `BundleHermesCTask` then
    // declared `android/app` as an @InputFile, so every task writing into
    // `android/app/build` (BuildConfig, AAR metadata check, each CMake step)
    // counted as an undeclared input, which Gradle 9 fails the build over
    // instead of warning about. It would have failed at execution too — there
    // was no CLI to run `export:embed` with.
    //
    // Resolving through `expo`'s own package.json finds the CLI whether npm
    // hoists it or nests it.
    cliFile = resolveNode("cliFile", ["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"])
    bundleCommand = "export:embed"
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.ortexmobile"
    defaultConfig {
        applicationId "com.ortexmobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // THE FIELD BUILD's identity. The keystore sits beside this file and is
        // gitignored (`*.keystore`); its passwords live in the machine's own
        // ~/.gradle/gradle.properties, never in the repo.
        //
        // Guarded, because a checkout without those properties must still be
        // able to build: with no credentials the release type falls back to the
        // debug key below, which is exactly what the template did.
        //
        // ⚠️ BACK THE KEYSTORE UP. Android identifies an app by its signature, so
        // a lost key means the sales team must uninstall before they can install
        // the next build — an update signed with a different key is refused.
        if (hasReleaseSigning) {
            release {
                storeFile file(ORTEX_STORE_FILE)
                storePassword ORTEX_STORE_PASSWORD
                keyAlias ORTEX_KEY_ALIAS
                keyPassword ORTEX_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            // R8 also drops unreferenced resources once it is shrinking code —
            // the two are a pair, and enabling only the first leaves every
            // drawable and string of the libraries in the APK.
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
